name: ci

# Every push to main and every PR checks the code the way AGENTS.md asks, then
# packages the app with `go tool mygo build` and keeps the exe and the installer
# as artifacts of the run. Pushing a version tag (0.2.15, or v0.2.15) goes one
# step further and publishes both as a release.
#
# A manual run with publish_tag set rebuilds the current branch and replaces
# the files of that existing release. It does not create a new release.

on:
  push:
    branches: [main]
    tags: ["*.*.*", "v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing release whose files this build replaces (e.g. 0.2.19); empty to only package
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A tag names one release: let it finish. Pushes to a branch may cancel.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: stage_mgr_go

jobs:
  build:
    name: Check and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: stage_mgr_go/go.mod
          cache-dependency-path: stage_mgr_go/go.sum

      # Keep the app's embedded version, updater version, and release tag aligned.
      - name: Check versions and manual release target
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $file = (Get-Content ../.version -Raw).Trim([char]0xFEFF).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "mygo.json version '$version' must use MAJOR.MINOR.PATCH."
          }
          if ($file -ne $version) {
            throw ".version says $file but mygo.json says $version: change them together."
          }
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME -replace '^v', ''
            if ($tag -ne $version) {
              throw "Tag $tag does not match version $version in mygo.json."
            }
          }
          if ($env:PUBLISH_TAG) {
            if ($env:PUBLISH_TAG -notmatch '^v?\d+\.\d+\.\d+$') {
              throw "publish_tag '$($env:PUBLISH_TAG)' must use MAJOR.MINOR.PATCH, optionally prefixed with v."
            }
            $tag = $env:PUBLISH_TAG -replace '^v', ''
            if ($tag -ne $version) {
              throw "publish_tag $($env:PUBLISH_TAG) does not match mygo.json version $version."
            }
            gh release view $env:PUBLISH_TAG | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Release '$($env:PUBLISH_TAG)' does not exist; manual rebuilds only replace existing releases."
            }
          }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Vet the UI
        run: go tool mygo vet .

      - name: Test
        run: go test ./...

      - name: Package
        run: go tool mygo build

      - name: Show what was packaged
        shell: pwsh
        run: |
          Get-Content mygo.json
          Get-ChildItem build/windows-amd64 | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: StageManagerForWindows-windows-amd64
          path: |
            stage_mgr_go/build/windows-amd64/StageManagerForWindows.exe
            stage_mgr_go/build/windows-amd64/*-setup-*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: assets

      - name: Name the assets as earlier releases do
        shell: bash
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$PUBLISH_TAG"
          [ -n "$tag" ] || tag="$REF_NAME"
          version="${tag#v}"
          mv assets/StageManagerForWindows.exe "assets/StageManagerForWindows.${version}.amd64.exe"
          mv "assets/stagemanagerforwindows-setup-${version}-amd64.exe" \
             "assets/StageManagerForWindows.Setup.${version}.amd64.exe"
          {
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_VERSION=$version"
          } >> "$GITHUB_ENV"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/*.exe --clobber
          elif [ -f "release-notes/$RELEASE_VERSION.md" ]; then
            gh release create "$RELEASE_TAG" assets/*.exe \
              --title "$RELEASE_VERSION" --notes-file "release-notes/$RELEASE_VERSION.md"
          else
            gh release create "$RELEASE_TAG" assets/*.exe \
              --title "$RELEASE_VERSION" --generate-notes
          fi
