name: Go checks

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stage_mgr_go

jobs:
  test:
    name: Build, vet and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: stage_mgr_go/go.mod
          cache-dependency-path: stage_mgr_go/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
