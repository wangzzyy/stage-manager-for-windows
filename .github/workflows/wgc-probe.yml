name: wgc-probe

on:
  pull_request:
    paths:
      - "tools/wgc-probe/**"
      - ".github/workflows/wgc-probe.yml"
  push:
    branches: [feat/live-card-gpu-capture]
    paths:
      - "tools/wgc-probe/**"
      - ".github/workflows/wgc-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S tools/wgc-probe -B build/wgc-probe -A x64
      - name: Build
        run: cmake --build build/wgc-probe --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: wgc-probe-windows-x64
          path: build/wgc-probe/Release/wgc-probe.exe
          if-no-files-found: error
          retention-days: 14
